header:
  version: 1

local_conf_header:
  50-development: |
    IMAGE_FEATURES:append = " ssh-server-openssh"
    SULKA_NFTABLES_CONF = "nftables-allow-established-lo-ssh-icmp-outgoing.conf"
    SULKA_DEVELOPMENT_MODE = "1"
    DISTRO_EXTRA_RDEPENDS:append = "${@" packagegroup-core-selinux " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
